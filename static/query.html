<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>明细查询 · 售后返件登记系统</title>

  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="icon" type="image/png" href="/static/assets/favicon.png?v=20260923b">

  <link rel="apple-touch-icon" href="/static/assets/logo.png?v=20260923b">

<link rel="stylesheet" href="/static/assets/app.css?v=20260923b">

  <style>

    /* 明细查询：一级窗口只有「售后单列表」（一单一行，铺满内容区），点单弹窗看明细。

       --q-h 让卡片高度跟视口走、表格区内滚、分页贴底，不会整页出现滚动条。 */

    .q-main { --q-h: calc(100vh - 352px); }

    .q-main > .card { margin-bottom: 0; min-width: 0; height: var(--q-h); display: flex; flex-direction: column; }

    .q-main > .card > .card__head { flex-shrink: 0; }

    .q-main > .card > .table-wrap { flex: 1 1 auto; max-height: none; min-height: 0; }

    .q-main > .card > .pager { margin-top: auto; flex-shrink: 0; }

    .q-main .table th, .q-main .table td { white-space: nowrap; }

    .q-main .table td { max-width: 240px; }

    .q-multi { margin-left: 4px; padding: 0 4px; border-radius: 3px; font-size: 11px;

               color: var(--text-tertiary); background: var(--bg-subtle); }

    /* 单内明细弹窗（二级页面）：放到接近整屏，表格区内部滚动、内容不被裁切 */

    .modal.od-modal { max-width: min(1600px, 96vw); height: min(92vh, 1080px); max-height: 94vh; }

    .modal.od-modal .modal__title { font-size: 15px; }

    .modal.od-modal .modal__head { padding: 12px 18px; }

    .modal.od-modal .modal__body { display: flex; flex-direction: column; min-height: 0; padding: 14px 16px; }

    .od-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 16px; padding: 12px 14px; background: var(--bg-subtle); border-radius: var(--radius); margin-bottom: 12px; flex-shrink: 0; }

    .od-meta__k { color: var(--text-tertiary); font-size: 12px; }

    .od-meta__v { font-size: 13px; word-break: break-all; }

    .od-rows { flex: 1 1 auto; min-height: 160px; max-height: none; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }

    .od-rows .table { margin-bottom: 0; }

    .od-rows .table th:first-child, .od-rows .table td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; }

    .od-rows .table th:first-child { z-index: 3; background: var(--bg-subtle); }

    .od-rows .table tbody tr:hover td:first-child { background: var(--bg-hover); }

    .od-pager { flex-shrink: 0; display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 10px 2px 0; }

    @media (max-width: 1100px) {

      .q-main { --q-h: 46vh; }

      .modal.od-modal { max-width: 98vw; height: 94vh; max-height: 96vh; }

      .modal.od-modal .modal__body { padding: 10px 12px; }

      .od-meta { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; }

      .od-rows { min-height: 120px; }

  </style>

</head>

<body>

<script src="/static/assets/common.js?v=20260923b"></script>

<script>

(async () => {

  const content = await mountLayout('query', '明细查询', '多条件筛选 · 关键词检索 · 导出 Excel', [

    h('button', { class: 'btn btn--sm', onclick: () => refreshAll() }, '刷新'),

    h('button', { class: 'btn btn--sm', onclick: doExport }, '导出 Excel'),

  ]);



  let META = null;

  try { META = await api('/meta'); }

  catch (e) { content.replaceChildren(h('div', { class: 'empty' }, '加载失败：' + e.message)); return; }



  const state = {

    keyword: new URLSearchParams(location.search).get('kw') || '',

    filters: {},

    /* 售后单列表（一级窗口唯一内容）：分页 / 排序 / 当前弹窗那张单的键 */

    order: '', orderRow: null, orderPage: 1, order_page_size: 20, orderRes: null,

    orderSortBy: 'registered_at', orderSortDir: 'desc',

    view: 'orders',        // orders = 右侧占位（默认）/ all = 全部返件明细

  };



  /* ---------------- 搜索栏 ---------------- */

  const kwInput = h('input', {

    class: 'input', style: { width: '280px' },

    placeholder: '搜索单号 / 条码 / 型号 / 厂家 / 现场…', value: state.keyword,

  });

  let kwTimer = null;

  kwInput.addEventListener('input', () => {

    clearTimeout(kwTimer);

    kwTimer = setTimeout(() => { state.keyword = kwInput.value.trim(); applyFilterChange(1); }, 300);

  });

  kwInput.addEventListener('keydown', e => {

    if (e.key === 'Enter') { clearTimeout(kwTimer); state.keyword = kwInput.value.trim(); applyFilterChange(1); }

  });



  /* ---------------- 筛选项 ---------------- */

  const filterGrid = h('div', { class: 'grid grid--4' });

  const filterState = {};



  function buildFilters() {

    const entries = META.filter_fields.map(f => {

      const sel = h('select', { class: 'select select--sm', id: 'flt-' + f.name },

        [h('option', { value: '' }, '全部' + f.label)]);



      function fill(list, withCount) {

        sel.replaceChildren(

          h('option', { value: '' }, '全部' + f.label),

          ...list.map(o => {

            const v = (o && typeof o === 'object') ? o.value : o;

            const c = (o && typeof o === 'object') ? o.use_count : null;

            return h('option', { value: v }, withCount && c ? `${v} (${c})` : String(v));

          }));

      }

      if (f.options && f.options.length) {

        fill(f.options, false);            // 固定选项字段（如 分析报告 是/否）

      } else {

        DictCache.getWithCount(f.name).then(opts => fill(opts, true)).catch(() => {});

      }

      sel.addEventListener('change', () => {

        if (sel.value) filterState[f.name] = sel.value; else delete filterState[f.name];

        applyFilterChange(1);

      });

      return h('div', { class: 'field', style: { marginBottom: '0' } }, [

        h('label', { class: 'field__label' }, f.label), sel,

      ]);

    });



    // 日期区间

    const dFrom = h('input', { class: 'input input--sm', type: 'date', id: 'flt-date-from' });

    const dTo = h('input', { class: 'input input--sm', type: 'date', id: 'flt-date-to' });

    [dFrom, dTo].forEach(el => el.addEventListener('change', () => {

      if (dFrom.value) filterState['return_date_from'] = dFrom.value; else delete filterState['return_date_from'];

      if (dTo.value) filterState['return_date_to'] = dTo.value; else delete filterState['return_date_to'];

      applyFilterChange(1);

    }));

    const dateRow = h('div', { class: 'field', style: { marginBottom: '0' } }, [

      h('label', { class: 'field__label' }, '退回时间区间'),

      h('div', { class: 'flex' }, [dFrom, h('span', { class: 'muted' }, '~'), dTo]),

    ]);



    filterGrid.replaceChildren(dateRow, ...entries);

  }

  buildFilters();



  // 筛选条件默认收起：平时只留关键词框，展开后原逻辑不变（按钮上带生效条件数）

  const filterBody = h('div', { class: 'card__body hidden' }, filterGrid);

  let filterOpen = false;

  const filterToggleBtn = h('button', { class: 'btn btn--sm btn--ghost', onclick: () => toggleFilters() }, '筛选');

  function toggleFilters(force) {

    filterOpen = (force === undefined) ? !filterOpen : !!force;

    filterBody.classList.toggle('hidden', !filterOpen);

    updateFilterBtn();

  }

  function updateFilterBtn() {

    const n = Object.keys(filterState).length + (state.keyword ? 1 : 0);

    filterToggleBtn.textContent = filterOpen ? '收起筛选' : (n ? `筛选 (${n})` : '筛选');

  }

  const filterCard = h('div', { class: 'card mb12' }, [

    h('div', { class: 'card__head' }, [

      h('div', { class: 'card__title' }, '筛选条件'),

      h('div', { class: 'card__tools' }, [

        h('button', { class: 'btn btn--sm btn--ghost', onclick: resetFilters }, '重置筛选'),

        filterToggleBtn,

      ]),

    ]),

    filterBody,

  ]);



  function resetFilters() {

    Object.keys(filterState).forEach(k => delete filterState[k]);

    $$('select', filterGrid).forEach(s => s.value = '');

    $('#flt-date-from').value = ''; $('#flt-date-to').value = '';

    kwInput.value = ''; state.keyword = '';

    applyFilterChange(1);

  }



  /* ---------------- 一级窗口：售后单聚合列表（一单一行，铺满内容区） ---------------- */

  /* 列顺序即表头顺序；12 列覆盖「整机厂家 / 项目风场 / 快递单号」等展示需求。

     一个售后单内出现多个厂家或风场时**全部列出**（后端 GROUP_CONCAT，不取 MIN 丢值），

     值后加「多」小标；空值一律显示「—」，不隐藏行。 */

  const ORDER_COLS = [

    ['order_no', '售后单号'], ['turbine_vendor', '整机厂家'], ['project_site', '项目风场'],

    ['carrier', '快递公司'], ['return_no', '快递单号'], ['lines', '明细行'],

    ['qty', '件数'], ['untested', '未检测'], ['status', '状态'],

    ['return_date', '退回时间'], ['registered_at', '登记时间'], ['registrar', '登记人'],

  ];

  const ORDER_TAGS = { done: 'tag--success', testing: 'tag--warning', untested: 'tag--info' };

  const ORDER_MULTI = { turbine_vendor: 'vendor_multi', project_site: 'site_multi' };



  const dash = v => (v === undefined || v === null || v === '') ? '—' : String(v);

  const multiTag = on => (on ? h('span', { class: 'q-multi', title: '该单内存在多个值' }, '多') : null);



  function orderCell(r, key) {

    const v = r[key];

    if (key === 'order_no') return h('td', {}, h('span', { class: 'link-cell' }, dash(v)));

    if (key === 'status') return h('td', {}, h('span', { class: 'tag ' + (ORDER_TAGS[r.status_key] || '') }, dash(v)));

    if (key === 'registered_at' || key === 'return_date') return h('td', { class: 'muted' }, v ? fmtDateTime(v) : '—');

    if (key === 'lines' || key === 'qty' || key === 'untested') return h('td', { class: 'num' }, num(v || 0));

    if (key === 'return_no') return h('td', { class: 'mono' }, dash(v));

    return h('td', { title: dash(v) }, [dash(v), multiTag(r[ORDER_MULTI[key]])]);

  }



  const orderHost = h('div', { class: 'table-wrap' });

  const orderPager = h('div', { class: 'pager' });

  const orderSummary = h('div', { class: 'card__hint', id: 'order-summary' });

  const orderCard = h('div', { class: 'card' }, [

    h('div', { class: 'card__head' }, [

      h('div', { class: 'card__title' }, '售后单列表'),

      orderSummary,

    ]),

    orderHost,

    orderPager,

  ]);

  /* 左栏售后单列表的分页：原先 orderPager 建好却从没填充，等于永远只能看第一页 */

  function renderOrderPager(res) {

    const sizes = [20, 50, 100];

    const sizeSel = h('select', { class: 'select select--sm', style: { width: '92px' } },

      sizes.map(s => h('option', { value: s, selected: s === state.order_page_size ? 'selected' : null }, `${s} 单/页`)));

    sizeSel.addEventListener('change', () => { state.order_page_size = Number(sizeSel.value); loadOrders(1); });



    const btn = (text, page, disabled) => h('button', {

      class: 'btn btn--sm', disabled: disabled ? 'disabled' : null,

      onclick: () => loadOrders(page),

    }, text);



    const jump = h('input', {

      class: 'input input--sm', style: { width: '60px' }, type: 'number', min: 1,

      max: Math.max(1, res.pages), placeholder: '页码',

    });

    jump.addEventListener('keydown', e => {

      if (e.key === 'Enter') {

        loadOrders(Math.min(Math.max(1, Number(jump.value) || 1), Math.max(1, res.pages)));

      }

    });



    orderPager.replaceChildren(

      h('span', {}, `共 ${num(res.total)} 单，${Math.max(1, res.pages)} 页`),

      h('div', { class: 'pager__spacer' }),

      sizeSel,

      btn('首页', 1, res.page <= 1),

      btn('上一页', res.page - 1, res.page <= 1),

      h('span', { class: 'mono', style: { padding: '0 4px' } }, `${res.page} / ${Math.max(1, res.pages)}`),

      btn('下一页', res.page + 1, res.page >= res.pages),

      btn('末页', res.pages, res.page >= res.pages),

      jump,

    );

  }

  async function loadOrders(page = 1) {

    state.orderPage = page;

    orderHost.replaceChildren(h('div', { class: 'empty' }, '加载中…'));

    try {

      const q = Object.assign({}, filterState, {

        keyword: state.keyword, page: state.orderPage, page_size: state.order_page_size,

        sort_by: state.orderSortBy, sort_dir: state.orderSortDir,

      });

      const res = await api('/returns/orders?' + qs(q));

      state.orderRes = res;

      renderOrders(res);

      renderOrderPager(res);

      orderSummary.textContent = `共 ${num(res.total)} 单 · 第 ${res.page}/${Math.max(1, res.pages)} 页`;

    } catch (e) {

      orderHost.replaceChildren(h('div', { class: 'empty' }, '加载失败：' + e.message));

      orderPager.replaceChildren();

    }

  }

  function renderOrders(res) {

    if (!res || !res.rows.length) {

      orderHost.replaceChildren(h('div', { class: 'empty' }, [

        h('div', { class: 'empty__icon' }, '○'), '没有符合条件的售后单',

      ]));

      return;

    }

    const thead = h('thead', {}, h('tr', {}, ORDER_COLS.map(([key, label]) => {

      const isSorted = state.orderSortBy === key;

      const arrow = isSorted ? h('span', { class: 'small', style: { marginLeft: '4px', color: '#0969da' } },

        state.orderSortDir === 'asc' ? '▲' : '▼') : null;

      return h('th', {

        style: { cursor: 'pointer', userSelect: 'none' },

        onclick: () => {

          if (state.orderSortBy === key) state.orderSortDir = state.orderSortDir === 'asc' ? 'desc' : 'asc';

          else { state.orderSortBy = key; state.orderSortDir = key === 'order_no' ? 'asc' : 'desc'; }

          loadOrders(1);

        },

      }, [label, arrow]);

    })));

    const tbody = h('tbody', {}, res.rows.map(r => h('tr', {

      class: r.order_no === state.order ? 'is-picked' : '',

      style: { cursor: 'pointer' },

      title: [r.turbine_vendor, r.project_site, r.status].filter(Boolean).join(' · '),

      onclick: () => selectOrder(r),

    }, ORDER_COLS.map(([key]) => orderCell(r, key)))));

    orderHost.replaceChildren(h('table', { class: 'table' }, [thead, tbody]));

  }

  /* 点左栏单行 → 弹窗看该单明细（方案 B：不再把单内明细塞进右栏）。

     弹窗里的字段全部取自**返件明细**（/api/returns 的列，标签取 META.field_labels），

     不混入发货/ERP 的字段。 */

  let orderModalCtl = null;



  const OD_PAGE_SIZE = 20;



  const OD_COLS = ['line_no', 'product_code', 'product_model', 'material_no', 'product_name',

                   'spec', 'product_category', 'production_year', 'return_qty',

                   'test_result', 'solution', 'completion', 'feedback_issue',

                   'fault_cause', 'responsibility', 'erp_handled', 'remark'];



  const OD_NUM_COLS = ['line_no', 'production_year', 'return_qty'];



  const label = k => (META.field_labels && META.field_labels[k]) || k;



  function cellText(v) {

    return (v === undefined || v === null || v === '') ? '—' : String(v);

  }



  /* 弹窗头部：单据级信息（明细行的公共字段 + 左栏聚合出来的行数/件数） */

  function odMeta(order) {

    const pairs = [

      [label('turbine_vendor'), order.turbine_vendor],

      [label('project_site'), order.project_site],

      [label('return_no'), order.return_no],

      [label('carrier'), order.carrier],

      [label('return_date'), order.return_date],

      [label('registrar'), order.registrar],

      [label('registered_at'), fmtDateTime(order.registered_at)],

      ['单据状态', order.status],

      ['明细行数', num(order.lines)],

      [label('return_qty') + '合计', num(order.qty)],

    ];

    return h('div', { class: 'od-meta' }, pairs.map(([k, v]) => h('div', {}, [

      h('div', { class: 'od-meta__k' }, k),

      h('div', { class: 'od-meta__v' }, cellText(v)),

    ])));

  }



  function odTable(res) {

    if (!res.rows.length) {

      return h('div', { class: 'empty' }, [

        h('div', { class: 'empty__icon' }, '○'), '本单没有返件明细',

      ]);

    }

    const thead = h('thead', {}, h('tr', {}, [

      ...OD_COLS.map(c => h('th', {}, label(c))),

      h('th', { style: { width: '70px' } }, '操作'),

    ]));

    const tbody = h('tbody', {}, res.rows.map(r => h('tr', {}, [

      ...OD_COLS.map(c => h('td', OD_NUM_COLS.includes(c) ? { class: 'num' } : {}, cellText(r[c]))),

      h('td', {}, h('button', { class: 'btn btn--sm btn--ghost', onclick: () => openDetail(r) }, '编辑')),

    ])));

    return h('table', { class: 'table' }, [thead, tbody]);

  }



  function exportOrder(orderNo) {

    download('/api/export?' + qs({ order_no: orderNo }));

    toast('正在生成 Excel，请留意浏览器下载', 'info');

  }



  async function openOrderDetail(order) {

    state.orderRow = order;

    state.order = order.order_no;            // 左栏高亮

    renderOrders(state.orderRes);



    const metaHost = h('div', {});

    const rowsHost = h('div', { class: 'od-rows' });

    const pagerLine = h('div', { class: 'od-pager' });

    let curPage = 1;



    const m = openModal({

      title: `售后单 ${order.order_no} · 明细`,

      wide: true,

      body: h('div', {}, [metaHost, rowsHost, pagerLine]),

      footer: [

        h('button', { class: 'btn', onclick: () => exportOrder(order.order_no) }, '导出本单 Excel'),

        h('div', { class: 'topbar__spacer' }),

        h('button', { class: 'btn btn--primary', onclick: () => m.close() }, '关闭'),

      ],

      onClose: () => { orderModalCtl = null; },

    });



    if (m && m.modal) m.modal.classList.add('od-modal');



    async function loadLines(p = 1) {

      curPage = p;

      rowsHost.replaceChildren(h('div', { class: 'empty' }, '加载中…'));

      try {

        const res = await api('/returns?' + qs({

          order_no: order.order_no, page: p, page_size: OD_PAGE_SIZE,

          sort_by: 'line_no', sort_dir: 'asc',

        }));

        rowsHost.replaceChildren(odTable(res));

        pagerLine.replaceChildren(

          h('span', { class: 'small muted' },

            `共 ${num(res.total)} 行 · 第 ${res.page}/${Math.max(1, res.pages)} 页`),

          h('button', {

            class: 'btn btn--sm', disabled: res.page <= 1 ? 'disabled' : null,

            onclick: () => loadLines(res.page - 1),

          }, '上一页'),

          h('button', {

            class: 'btn btn--sm', disabled: res.page >= res.pages ? 'disabled' : null,

            onclick: () => loadLines(res.page + 1),

          }, '下一页'),

        );

      } catch (e) {

        rowsHost.replaceChildren(h('div', { class: 'empty' }, [

          '加载失败：' + e.message,

          h('div', { style: { marginTop: '10px' } },

            h('button', { class: 'btn btn--sm', onclick: () => loadLines(curPage) }, '重试')),

        ]));

        pagerLine.replaceChildren();

      }

    }



    orderModalCtl = { reload: () => loadLines(curPage) };

    metaHost.replaceChildren(odMeta(order));

    await loadLines(1);

  }



  function selectOrder(r) {

    openOrderDetail(r);

  }

  content.replaceChildren(

    h('div', { class: 'card mb12' }, h('div', { class: 'card__body flex flex-wrap' }, [

      kwInput,

      h('span', { class: 'small muted' }, '支持单号、条码、型号、厂家、现场、备注等模糊检索'),

      h('div', { class: 'topbar__spacer' }),

      h('button', { class: 'btn btn--sm', onclick: doExport }, '导出当前结果'),

    ])),

    filterCard,

    h('div', { class: 'q-main' }, orderCard),

  );



  /* ---------------- 刷新 ---------------- */

  function refreshAll() {

    loadOrders(state.orderPage);

    if (orderModalCtl) orderModalCtl.reload();

  }

  /* 筛选 / 搜索变化：售后单列表回到第一页，并退出「只看某一张单」的高亮 */

  function applyFilterChange(page = 1) {

    updateFilterBtn();

    state.order = '';

    state.orderRow = null;

    loadOrders(1);

  }

  /* ---------------- 详情 / 编辑 ---------------- */

  async function openDetail(row) {

    const groups = META.field_groups;

    const inputs = {};

    // 产品信息自动回填：记下「上一次由系统自动填入」的值，供「人工优先」判断

    const autoFilled = {};



    /* 选中产品信息候选后，按码从**匹配数据库**回填同组的其它字段。

       口径两条，写清楚免得以后被"顺手放宽"：

         ① **只有能唯一定位一条物料主档的字段才当入口** ——

            料号 / 产品型号（= 规格）/ 规格 都可以；「产品类别」不行

            （一类多料，拿类别查不到唯一物料），它只填自己。

         ② **人工优先**：只填空格，或覆盖"上一次由系统自动填入"的那个值；

            只要某格被人工改过（当前值 ≠ 上次自动值）就永不改写。

       两者都是这条铁律的推论：自动填的值必须能被人为覆盖，

       且后续自动逻辑不得再改写人工值。 */

    const FILL_ENTRY = ['material_no', 'product_model', 'spec'];



    async function autofillFromProduct(field, value) {

      if (!FILL_ENTRY.includes(field)) return;

      const code = String(value || '').trim();

      if (!code) return;

      let res;

      try { res = await api('/items/fill?code=' + encodeURIComponent(code)); }

      catch (e) { return; }

      if (!res.found) return;



      const applied = [];

      Object.entries(res.suggest || {}).forEach(([k, v]) => {

        if (k === field || !v) return;

        const ctl = inputs[k];

        if (!ctl) return;

        const cur = String((ctl.getValue ? ctl.getValue() : ctl.value) || '').trim();

        if (cur && cur !== String(autoFilled[k] || '')) return;   // 人工改过 → 不动

        if (ctl.setValue) ctl.setValue(v); else ctl.value = v;

        autoFilled[k] = String(v);

        applied.push(k);

      });

      if (applied.length) {

        toast(`已从匹配数据库回填 ${applied.length} 项`, 'success');

      }

    }



    function makeField(f) {

      const id = 'e-' + f.name;



      // 照片证据：网格控件自带取值接口，不走下面的通用 input 逻辑

      if (f.type === 'photos') {

        const pg = photoGrid({

          name: f.name, detailKey: row.detail_key || '',

          orderNo: row.order_no || '', value: row[f.name],

          limits: META.photo_limits || {},

        });

        inputs[f.name] = pg;

        return h('div', {

          class: 'field field--wide', style: { marginBottom: '0' },

        }, [

          h('label', { class: 'field__label' }, f.label), pg,

        ]);

      }



      // 可搜索下拉 + 远程候选。两个类型都走这里：

      //   search-item —— 料号这类（source=items，走匹配库）

      //   search-dict —— 产品型号 / 类别 / 反馈现象 / 检测结果…

      // ⚠️ `search-dict` 以前漏了这个分支，落到最后的 else 变成**普通输入框** ——

      //    于是明细查询的编辑弹窗里，「产品型号」「产品类别」「反馈现象」等一整串

      //    字段没有任何候选（别的页面有），而语法检查与"控件存在"类断言都查不出来。

      //    候选来源由 `f.source` 决定，见 `fetchCandidates`（common.js）。

      if (f.type === 'search-item' || f.type === 'search-dict') {

        const cb = combobox({

          name: f.name,

          options: [],

          allowNew: true,

          value: (row[f.name] === null || row[f.name] === undefined)

            ? '' : String(row[f.name]),

          placeholder: f.placeholder || '输入关键字搜索',

          remoteSearch: kw => fetchCandidates(f, kw),

          // 选中产品信息候选后，按码回填同组的其它字段（人工优先，见下）

          onChange: v => autofillFromProduct(f.name, v),

        });

        cb.input.dataset.field = f.name;

        inputs[f.name] = cb;             // 有 .value 访问器，保存时按它取值

        // 本地候选（该字段历史登记过的值）异步补上，不阻塞弹窗打开。

        // 匹配库字段（source=items）**不混历史值** —— 那边的值才是权威，

        // 历史里的脏值混进来会让候选看着像"匹配库出了问题"。

        if (f.source !== 'items') {

          DictCache.get(f.name)

            .then(vs => { if (vs && vs.length) cb.setOptions(vs); })

            .catch(() => {});

        }

        return h('div', {

          class: 'field', style: { marginBottom: '0' },

        }, [

          h('label', { class: 'field__label' }, f.label), cb,

        ]);

      }



      let el;

      if (f.type === 'textarea') {

        el = h('textarea', { class: 'textarea', id });

      } else if (f.type === 'select-dict') {

        const listId = 'edl-' + f.name;

        el = h('input', { class: 'input', id, list: listId, autocomplete: 'off' });

        const dl = h('datalist', { id: listId });

        DictCache.get(f.name).then(vs =>

          dl.replaceChildren(...vs.map(v => h('option', { value: v })))).catch(() => {});

        el = h('div', {}, [el, dl]);

      } else if (f.type === 'select-fixed') {

        const opts = (META.fixed_options && META.fixed_options[f.name]) || [];

        // no_empty 的字段是「空值即默认值」的两值字段：不给空选项，

        // 编辑历史空值时直接落到默认值（与处理登记页、后端归一三处一致）

        el = h('select', { class: 'input', id }, [

          f.no_empty ? null : h('option', { value: '' }, '未填写'),

          ...opts.map(o => h('option', { value: o }, o)),

        ]);

        // 注意：这里必须读 row（本函数的入参），不能写 cur ——

        // cur 是 scan.html 里别的函数的局部变量，在本文件里未声明；

        // 写错会让 makeField 抛 ReferenceError，openDetail 整体中断，

        // 表现为「点明细行没反应、编辑弹窗根本不出现」（语法检查查不出来）。

        if (f.no_empty) {

          const nv = row[f.name];

          el.value = (nv === null || nv === undefined)

            ? (f.default || '') : String(nv);

        }

      } else {

        el = h('input', {

          class: 'input', id,

          type: f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text'),

          step: f.type === 'number' ? 'any' : null,

        });

      }

      const target = (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'

        || el.tagName === 'SELECT') ? el : el.querySelector('input, textarea');

      const v = row[f.name];

      if (f.name === 'return_date' || f.name === 'test_date') {

        target.value = v ? fmtDate(v) : '';

      } else {

        target.value = (v === null || v === undefined) ? '' : v;

      }

      // auto 标记的字段是系统派生的（如完结状况），任何页面都不可编辑

      if (f.auto && target) {

        target.readOnly = true;

        target.disabled = target.tagName === 'SELECT';

        target.classList.add('input--locked');

        target.title = '由检测字段自动判定，不可手工修改';

      }

      inputs[f.name] = target;

      return h('div', { class: 'field', style: { marginBottom: '0' } }, [

        h('label', { class: 'field__label', for: id }, f.label), el,

      ]);

    }



    const body = h('div', {}, [

      h('div', { class: 'match-banner match-banner--hit mb12' }, [

        h('span', { class: 'match-banner__icon' }, '◎'),

        h('div', {}, [

          h('div', { class: 'mono', style: { fontWeight: '600' } }, row.detail_key || ''),

          h('div', { class: 'small' },

            `售后单号 ${row.order_no || '—'} · 行号 ${row.line_no ?? '—'} · 登记于 ${fmtDateTime(row.registered_at)}`),

        ]),

      ]),

      ...groups.map(g => h('div', { class: 'mb12' }, [

        h('div', { style: { fontWeight: '600', marginBottom: '8px', fontSize: '13px' } }, g.title),

        h('div', { class: 'grid grid--3' }, g.fields.map(makeField)),

      ])),

    ]);



    const m = openModal({

      title: '编辑返件明细', wide: true, body,

      footer: [

        h('button', {

          class: 'btn btn--danger',

          onclick: async () => {

            const ok = await confirmDialog(

              `确定删除记录 <b class="mono">${escapeHtml(row.detail_key)}</b> 吗？删除后不可恢复。`,

              { title: '删除记录', danger: true });

            if (!ok) return;

            try {

              await api('/returns/' + encodeURIComponent(row.detail_key), { method: 'DELETE' });

              DictCache.invalidate();

              toast('已删除', 'success'); m.close(); refreshAll();

            } catch (e) { toast('删除失败：' + e.message, 'error'); }

          },

        }, '删除'),

        h('div', { class: 'topbar__spacer' }),

        h('button', { class: 'btn', onclick: () => m.close() }, '取消'),

        h('button', {

          class: 'btn btn--primary',

          onclick: async () => {

            const data = {};

            Object.entries(inputs).forEach(([k, el]) => { data[k] = (el.value || '').trim(); });

            delete data.order_no;

            try {

              await api('/returns/' + encodeURIComponent(row.detail_key), { method: 'PUT', body: data });

              DictCache.invalidate();

              toast('已保存', 'success'); m.close(); refreshAll();

            } catch (e) { toast('保存失败：' + e.message, 'error'); }

          },

        }, '保存修改'),

      ],

    });

  }



  /* ---------------- 导出 ---------------- */

  function doExport() {

    const q = Object.assign({}, filterState, { keyword: state.keyword });

    const url = '/api/export?' + qs(q);

    download(url);

    toast('正在生成 Excel，请留意浏览器下载', 'info');

  }



  /* 从 URL 带入关键词时直接搜索 */

  if (state.keyword) kwInput.value = state.keyword;

  updateFilterBtn();

  loadOrders(1);

})();

</script>
